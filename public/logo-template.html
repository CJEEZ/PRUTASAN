<!DOCTYPE html>
<html>
<head>
    <title>FruitWeb Logo Generator</title>
</head>
<body>
    <h1>FruitWeb Logo</h1>
    <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Circular background -->
        <circle cx="100" cy="100" r="100" fill="#FEF3C7"/>
        
        <!-- Shopping cart base -->
        <rect x="50" y="100" width="100" height="60" fill="none" stroke="#4B8B8B" stroke-width="3" rx="5"/>
        
        <!-- Cart wheels -->
        <circle cx="65" cy="165" r="8" fill="none" stroke="#4B8B8B" stroke-width="2"/>
        <circle cx="135" cy="165" r="8" fill="none" stroke="#4B8B8B" stroke-width="2"/>
        
        <!-- Cart handle -->
        <path d="M 60 100 Q 100 50 140 100" fill="none" stroke="#4B8B8B" stroke-width="3"/>
        
        <!-- Fruits in cart -->
        <!-- Mango -->
        <ellipse cx="80" cy="120" rx="12" ry="14" fill="#F59E0B"/>
        
        <!-- Orange -->
        <circle cx="100" cy="115" r="11" fill="#FB923C"/>
        
        <!-- Apple -->
        <circle cx="120" cy="120" r="10" fill="#DC2626"/>
        
        <!-- Grapes -->
        <circle cx="110" cy="100" r="4" fill="#7C3AED"/>
        <circle cx="115" cy="100" r="4" fill="#7C3AED"/>
        <circle cx="113" cy="105" r="4" fill="#7C3AED"/>
        
        <!-- Text -->
        <text x="100" y="185" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#166534">FruitWeb</text>
    </svg>
    
    <p><strong>Instructions:</strong></p>
    <ol>
        <li>Save this SVG as logo.svg in the public/ directory</li>
        <li>Or convert the FruitWeb logo image you have to PNG and save as public/logo.png</li>
        <li>The application will automatically use it</li>
    </ol>
</body>
</html>
