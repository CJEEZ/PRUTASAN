    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleContainer = document.getElementById('role-toggle-container');
            const userButton = toggleContainer.querySelector('[data-role="user"]');
            const adminButton = toggleContainer.querySelector('[data-role="admin"]');
            const userForm = document.getElementById('user-signup-form');
            const adminForm = document.getElementById('admin-signup-form');

            const switchRole = (role) => {
                if (role === 'admin') {
                    // Style the buttons
                    adminButton.classList.add('bg-white', 'text-gray-800', 'shadow-md');
                    adminButton.classList.remove('text-gray-500', 'hover:bg-gray-200');
                    userButton.classList.remove('bg-white', 'text-gray-800', 'shadow-md');
                    userButton.classList.add('text-gray-500', 'hover:bg-gray-200');

                    // Toggle the forms
                    userForm.classList.add('hidden');
                    adminForm.classList.remove('hidden');
                } else {
                    // Style the buttons
                    userButton.classList.add('bg-white', 'text-gray-800', 'shadow-md');
                    userButton.classList.remove('text-gray-500', 'hover:bg-gray-200');
                    adminButton.classList.remove('bg-white', 'text-gray-800', 'shadow-md');
                    adminButton.classList.add('text-gray-500', 'hover:bg-gray-200');

                    // Toggle the forms
                    adminForm.classList.add('hidden');
                    userForm.classList.remove('hidden');
                }
            };

            userButton.addEventListener('click', () => switchRole('user'));
            adminButton.addEventListener('click', () => switchRole('admin'));

            // Initialize based on the current role (if any) or default to user
            const initialRole = document.querySelector('input[name="role"][value="admin"]') ? 'admin' : 'user';
            switchRole(initialRole);
        });
    </script>
