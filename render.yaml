services:
  - type: web
    name: prutexpres
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_NAME
        value: PRUTEXPRES
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://prutexpres.onrender.com
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: log
      - key: FILESYSTEM_DISK
        value: public
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: prutexpres-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: prutexpres-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: prutexpres-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: prutexpres-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: prutexpres-db
          property: password

databases:
  - name: prutexpres-db
    plan: free
    databaseName: prutexpres
